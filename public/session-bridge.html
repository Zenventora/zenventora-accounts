<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZenVentora Account Session Bridge</title>
</head>
<body>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const ACCOUNT_ORIGIN = "https://accounts.zenventora.in";
  const ALLOWED_PARENTS = new Set([
    "https://zenventora.in",
    "https://www.zenventora.in",
    "https://emenu.zenventora.in"
  ]);
  const parentOrigin = (() => {
    try {
      const origin = new URL(document.referrer).origin;
      return ALLOWED_PARENTS.has(origin) ? origin : null;
    } catch {
      return null;
    }
  })();

  const supabase = createClient(
    "https://flwzqlywdlwatycxexmk.supabase.co",
    "sb_publishable_QN1aNd7wxjkb6ktD6L8GOQ_nsfV1_bY",
    { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false } }
  );

  const send = (type, payload = {}) => {
    if (!parentOrigin || window.parent === window) return;
    window.parent.postMessage({ namespace: "zenventora-account-bridge", type, ...payload }, parentOrigin);
  };
  const safeUser = (user) => user ? ({
    id: user.id,
    email: user.email || "",
    user_metadata: {
      full_name: user.user_metadata?.full_name || "",
      name: user.user_metadata?.name || "",
      company_name: user.user_metadata?.company_name || "",
      avatar_url: user.user_metadata?.avatar_url || "",
      picture: user.user_metadata?.picture || ""
    }
  }) : null;

  window.addEventListener("message", async (event) => {
    if (!parentOrigin || event.origin !== parentOrigin || event.source !== window.parent) return;
    if (event.data?.type !== "zenventora:signout") return;
    const { error } = await supabase.auth.signOut({ scope: "global" });
    if (error) send("signout_error", { message: error.message });
    else send("signed_out");
  });

  supabase.auth.onAuthStateChange((_event, session) => {
    send("session", { user: safeUser(session?.user || null) });
  });

  const { data, error } = await supabase.auth.getSession();
  if (error) send("session", { user: null });
  else send("session", { user: safeUser(data.session?.user || null) });
</script>
</body>
</html>
