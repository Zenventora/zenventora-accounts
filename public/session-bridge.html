<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ZenVentora Account Session Bridge</title></head>
<body>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://flwzqlywdlwatycxexmk.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QN1aNd7wxjkb6ktD6L8GOQ_nsfV1_bY";
  const ALLOWED_PARENTS = new Set([
    "https://zenventora.in",
    "https://www.zenventora.in",
    "https://emenu.zenventora.in",
    "https://siteradar.zenventora.in",
    "https://vadix.zenventora.in"
  ]);

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
  });

  function parentOrigin() {
    return ALLOWED_PARENTS.has(document.referrer ? new URL(document.referrer).origin : "")
      ? new URL(document.referrer).origin
      : null;
  }

  async function sendSession(targetOrigin) {
    if (!targetOrigin || !ALLOWED_PARENTS.has(targetOrigin)) return;
    const { data } = await supabase.auth.getSession();
    const session = data.session;
    window.parent.postMessage({
      type: "zenventora:account-session",
      session: session ? {
        access_token: session.access_token,
        refresh_token: session.refresh_token
      } : null
    }, targetOrigin);
  }

  const initialOrigin = parentOrigin();
  if (initialOrigin) sendSession(initialOrigin);

  window.addEventListener("message", event => {
    if (!ALLOWED_PARENTS.has(event.origin) || event.source !== window.parent) return;
    if (event.data?.type === "zenventora:request-session") {
      sendSession(event.origin);
    }
  });

  supabase.auth.onAuthStateChange(() => {
    const origin = parentOrigin();
    if (origin) sendSession(origin);
  });
</script>
</body>
</html>
